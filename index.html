
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SisVenda Pro - App Style</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .step-content { display: none; }
        .step-content.active { display: block; animation: slideUp 0.3s ease-out; }
        @keyframes slideUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        .product-card:hover { transform: scale(1.02); transition: all 0.2s; }
    </style>
</head>
<body class="bg-gray-50 min-h-screen">

    <nav class="bg-white border-b sticky top-0 z-50 p-4 shadow-sm">
        <div class="container mx-auto flex justify-between items-center">
            <button onclick="changeStep('step-menu')" class="text-indigo-600 font-bold flex items-center gap-2">
                <i class="fas fa-chevron-left"></i> Voltar
            </button>
            <h1 class="font-black text-xl tracking-tighter text-slate-800">SHOP<span class="text-indigo-600">MANAGER</span></h1>
            <div class="flex gap-4">
                <i class="fas fa-search text-gray-400"></i>
                <i class="fas fa-shopping-bag text-indigo-600"></i>
            </div>
        </div>
    </nav>

    <main class="container mx-auto max-w-4xl p-4">

        <section id="step-login" class="step-content active py-10">
            <div class="bg-white p-8 rounded-3xl shadow-xl border max-w-sm mx-auto">
                <div class="w-20 h-20 bg-indigo-100 rounded-full mx-auto mb-6 flex items-center justify-center">
                    <i class="fas fa-lock text-3xl text-indigo-600"></i>
                </div>
                <h2 class="text-center text-2xl font-bold mb-6">Acesse sua Conta</h2>
                <input type="text" placeholder="Usuário" class="w-full mb-4 p-4 bg-gray-50 border rounded-2xl outline-none">
                <input type="password" placeholder="Senha" class="w-full mb-6 p-4 bg-gray-50 border rounded-2xl outline-none">
                <button onclick="changeStep('step-menu')" class="w-full bg-indigo-600 text-white font-bold py-4 rounded-2xl shadow-lg shadow-indigo-100 transition active:scale-95">ENTRAR NO SISTEMA</button>
            </div>
        </section>

        <section id="step-menu" class="step-content py-6">
            <h2 class="text-2xl font-bold mb-6 text-slate-800">O que deseja fazer?</h2>
            <div class="grid grid-cols-2 md:grid-cols-4 gap-4 mb-10">
                <button onclick="changeStep('step-vitrine')" class="bg-indigo-500 p-6 rounded-3xl text-white shadow-lg shadow-indigo-100 flex flex-col items-center gap-3">
                    <i class="fas fa-store text-2xl"></i>
                    <span class="text-sm font-bold">Ver Vitrine</span>
                </button>
                <button onclick="changeStep('step-produto')" class="bg-white p-6 rounded-3xl text-slate-700 shadow-sm border flex flex-col items-center gap-3">
                    <i class="fas fa-plus-circle text-2xl text-indigo-500"></i>
                    <span class="text-sm font-bold">Novo Item</span>
                </button>
                <button onclick="changeStep('step-cliente')" class="bg-white p-6 rounded-3xl text-slate-700 shadow-sm border flex flex-col items-center gap-3">
                    <i class="fas fa-user-plus text-2xl text-emerald-500"></i>
                    <span class="text-sm font-bold">Clientes</span>
                </button>
                <button onclick="changeStep('step-venda')" class="bg-slate-800 p-6 rounded-3xl text-white shadow-lg flex flex-col items-center gap-3">
                    <i class="fas fa-cash-register text-2xl text-amber-400"></i>
                    <span class="text-sm font-bold">Vender</span>
                </button>
            </div>

            <div class="flex justify-between items-end mb-4">
                <h3 class="font-bold text-lg">Produtos em Destaque</h3>
                <button onclick="changeStep('step-vitrine')" class="text-indigo-600 text-sm font-bold">Ver tudo</button>
            </div>
            <div class="grid grid-cols-2 gap-4">
                <div class="bg-white p-3 rounded-2xl border shadow-sm product-card">
                    <div class="w-full h-32 bg-gray-100 rounded-xl mb-3 flex items-center justify-center text-gray-400">
                        <i class="fas fa-image text-3xl"></i>
                    </div>
                    <p class="text-xs text-gray-400 uppercase font-bold">Eletrônicos</p>
                    <p class="font-bold text-slate-800">Smartphone XYZ</p>
                    <p class="text-indigo-600 font-black mt-1">R$ 1.200,00</p>
                </div>
                <div class="bg-white p-3 rounded-2xl border shadow-sm product-card">
                    <div class="w-full h-32 bg-gray-100 rounded-xl mb-3 flex items-center justify-center text-gray-400">
                        <i class="fas fa-image text-3xl"></i>
                    </div>
                    <p class="text-xs text-gray-400 uppercase font-bold">Acessórios</p>
                    <p class="font-bold text-slate-800">Fone Bluetooth</p>
                    <p class="text-indigo-600 font-black mt-1">R$ 150,00</p>
                </div>
            </div>
        </section>

        <section id="step-vitrine" class="step-content py-6">
            <div class="flex items-center gap-4 mb-6">
                <div class="flex-1 bg-white p-3 rounded-2xl border flex items-center gap-3">
                    <i class="fas fa-search text-gray-400"></i>
                    <input type="text" placeholder="Buscar produtos..." class="bg-transparent w-full outline-none">
                </div>
            </div>
            <div class="grid grid-cols-2 md:grid-cols-3 gap-6">
                <div class="bg-white rounded-3xl overflow-hidden shadow-sm border border-gray-100">
                    <img src="https://images.unsplash.com/photo-1523275335684-37898b6baf30?auto=format&fit=crop&w=400&q=80" alt="Produto" class="w-full h-40 object-cover">
                    <div class="p-4">
                        <p class="text-lg font-bold">Relógio Modern</p>
                        <p class="text-sm text-gray-500 mb-3">ID: #001</p>
                        <div class="flex justify-between items-center">
                            <span class="text-indigo-600 font-black">R$ 299,00</span>
                            <button class="bg-indigo-50 p-2 rounded-lg text-indigo-600"><i class="fas fa-cart-plus"></i></button>
                        </div>
                    </div>
                </div>
                <div class="bg-white rounded-3xl overflow-hidden shadow-sm border border-gray-100">
                    <img src="https://images.unsplash.com/photo-1505740420928-5e560c06d30e?auto=format&fit=crop&w=400&q=80" alt="Produto" class="w-full h-40 object-cover">
                    <div class="p-4">
                        <p class="text-lg font-bold">Fone Premium</p>
                        <p class="text-sm text-gray-500 mb-3">ID: #002</p>
                        <div class="flex justify-between items-center">
                            <span class="text-indigo-600 font-black">R$ 450,00</span>
                            <button class="bg-indigo-50 p-2 rounded-lg text-indigo-600"><i class="fas fa-cart-plus"></i></button>
                        </div>
                    </div>
                </div>
            </div>
        </section>

        <section id="step-venda" class="step-content py-6">
            <div class="bg-slate-900 text-white p-6 rounded-3xl mb-6">
                <p class="text-slate-400 text-sm uppercase font-bold tracking-widest mb-1">Total do Pedido</p>
                <h2 class="text-4xl font-black text-amber-400">R$ 0,00</h2>
            </div>
            <div class="bg-white p-6 rounded-3xl border shadow-sm space-y-4">
                <h3 class="font-bold border-b pb-2">Detalhes do Carrinho</h3>
                <div class="flex items-center justify-between py-2 border-b border-dashed text-gray-400 text-sm">
                    <span>Nenhum item adicionado</span>
                </div>
                <div class="grid grid-cols-2 gap-3">
                    <input type="number" placeholder="ID do Produto" class="p-4 bg-gray-50 border rounded-2xl outline-none">
                    <input type="number" placeholder="Quantidade" class="p-4 bg-gray-50 border rounded-2xl outline-none">
                </div>
                <button class="w-full bg-slate-100 text-slate-800 font-bold py-4 rounded-2xl hover:bg-slate-200">+ ADICIONAR ITEM</button>
                <button onclick="alert('Venda Finalizada!'); changeStep('step-menu')" class="w-full bg-emerald-500 text-white font-bold py-5 rounded-2xl shadow-lg shadow-emerald-100 mt-4">FINALIZAR COMPRA</button>
            </div>
        </section>

    </main>

    <script>
        function changeStep(stepId) {
            document.querySelectorAll('.step-content').forEach(section => {
                section.classList.remove('active');
            });
            document.getElementById(stepId).classList.add('active');
            window.scrollTo(0,0);
        }
    </script>
</body>
</html>
